# Builds platform binaries on release, uploads to the GitHub Release with
# SHA256 checksums, and emits SLSA / GitHub artifact attestations.
# Consumed by the @mcptoolshop/tool-compass npm wrapper
# (via @mcptoolshop/npm-launcher) for zero-prerequisite `npx` installs.
#
# Asset naming convention (must match npm-launcher expectations):
#   binary:    tool-compass-<version>-<os>-<arch>[.exe]
#   checksums: checksums-<version>.txt
#
# Called from release.yml AFTER the GitHub Release exists and BEFORE
# `npm publish`, so the advertised npx path is atomic (F-2f3fd9d7).
# `release: published` retained for manual hand-cut Releases
# (`gh release create` from a maintainer's terminal — attributed to a user,
# fires normally). `workflow_dispatch` retained for manually (re)building
# binaries for a tag. The old `workflow_run` trigger is gone: release.yml
# now calls this workflow directly, and a post-success workflow_run would
# double-build after npm had already published.
name: Release Binaries

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to build binaries for (e.g. v2.5.0)"
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build binaries for (e.g. v2.3.0)"
        required: true
        type: string

# Serialize per-tag — resolved across all trigger types. Never cancel a
# mid-flight binary build / asset upload.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

# Standalone triggers (release / workflow_dispatch). Ignored when this file is
# called as a reusable workflow — the caller grants the token scopes.
permissions:
  contents: read

env:
  TOOL_NAME: tool-compass
  ENTRYPOINT: cli.py

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            ext: ""
          - os: macos-latest
            target: darwin-arm64
            ext: ""
          - os: windows-latest
            target: win-x64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install package[ui] + PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # [ui] pulls Gradio. A core-only `pip install .` freezes a binary
          # that cannot serve `tool-compass ui` (the npx zero-prerequisite path).
          pip install ".[ui]" "pyinstaller>=6.9.0"
          python -c "import ui, gradio"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build single-file binary
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # --collect-submodules covers dynamic imports MCP / Gradio / Rich pull in.
          # --hidden-import ui: cli._cmd_ui imports ui inside try/except ImportError,
          # which PyInstaller treats as optional and would drop from the freeze.
          # --console keeps stdout/stderr behavior identical to `python cli.py`.
          pyinstaller --onefile \
            --name "${{ env.TOOL_NAME }}" \
            --console \
            --collect-submodules mcp.client \
            --collect-submodules mcp.server \
            --collect-submodules mcp.types \
            --collect-submodules mcp.shared \
            --exclude-module mcp.cli \
            --exclude-module typer \
            --collect-submodules hnswlib \
            --collect-submodules numpy \
            --collect-submodules httpx \
            --hidden-import ui \
            --collect-submodules gradio \
            "${{ env.ENTRYPOINT }}"
          OUTNAME="${{ env.TOOL_NAME }}-${VERSION}-${{ matrix.target }}${{ matrix.ext }}"
          mv "dist/${{ env.TOOL_NAME }}${{ matrix.ext }}" "dist/${OUTNAME}"
          echo "Built: dist/${OUTNAME}"
          ls -la "dist/${OUTNAME}"

      - name: Smoke test binary
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BIN="dist/${{ env.TOOL_NAME }}-${VERSION}-${{ matrix.target }}${{ matrix.ext }}"
          # --version is wired on the root parser as of v2.2.1 (a942a67).
          "$BIN" --version
          "$BIN" --help
          # Zero-prerequisite `npx … ui` path. argparse prints this without
          # importing ui.py; the freeze still needs [ui] + --hidden-import ui
          # + --collect-submodules gradio or the launched binary cannot serve.
          "$BIN" ui --help

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/${{ env.TOOL_NAME }}-*
          retention-days: 7

  attach:
    name: Attach binaries + checksums to release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          cd artifacts
          sha256sum * > "checksums-${VERSION}.txt"
          echo "--- checksums-${VERSION}.txt ---"
          cat "checksums-${VERSION}.txt"

      - name: Attest binaries and checksums (SLSA provenance)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: artifacts/*

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          files: artifacts/*
          fail_on_unmatched_files: true
